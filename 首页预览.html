raft.types.find(t=>t.id===r.from),b=draft.types.find(t=>t.id===r.to);if(!a||!b)return '';const same=a.id===b.id;const d=same?`M${a.x+130} ${a.y}c100 -65 100 100 20 40`:`M${a.x+80} ${a.y+28}L${b.x+80} ${b.y+28}`;return `<g class="onto-edge ${selection===r.id?'active':''}" data-onto="select" data-id="${r.id}" tabindex="0" role="button" aria-label="关系 ${ontoEscape(r.name)}"><path d="${d}" marker-end="url(#onto-arrow)"/><text x="${same?a.x+180:(a.x+b.x)/2+80}" y="${same?a.y-12:(a.y+b.y)/2+14}" text-anchor="middle">${ontoEscape(r.name)}</text></g>`;}).join('')}${draft.types.map(t=>`<g class="onto-node ${selection===t.id?'active':''}" data-onto="select" data-id="${t.id}" data-onto-node="${t.id}" transform="translate(${t.x},${t.y})" role="button" tabindex="0" aria-label="对象类型 ${ontoEscape(t.name)}"><rect width="162" height="64" rx="9"/><rect class="onto-node-accent" width="5" height="64" rx="2"/><text x="18" y="27" class="onto-node-title">${ontoEscape(t.name)}</text><text x="18" y="48" class="onto-node-subtitle">${ontoEscape(t.id)} · ${t.fields.length} 属性</text></g>`).join('')}</svg></div><div class="onto-canvas-caption">${draft.types.length} 类对象 <span>·</span> ${draft.relations.length} 类关系 <span>·</span> 类型定义图</div></div><aside class="onto-property-pane"><div class="onto-pane-head"><strong>${relation?'关系属性':'对象属性'}</strong>${editable()&&(type||relation)?ontoButton(relation?'relation-edit':'type-edit','编辑',`data-id="${selection}"`):''}</div>${type?`<div class="onto-object-summary"><span class="badge blue">对象类型</span><h2>${ontoEscape(type.name)}</h2><code>${ontoEscape(type.id)}</code><p>${ontoEscape(type.description)}</p></div><div class="onto-fields">${type.fields.map(f=>`<div><div><strong>${ontoEscape(f.name)}</strong>${f.required?'<span class="onto-required">必填</span>':''}</div><code>${ontoEscape(f.key)}</code><small>${ontoEscape(f.datatype)}${f.unit?' · '+ontoEscape(f.unit):''}${f.min!==undefined?' · ≥ '+f.min:''}${f.max!==undefined?' · ≤ '+f.max:''}${f.enum?.length?' ·   function termsHtml(){const rows=draft.terms.filter(t=>`${t.standard} ${t.aliases.join(' ')} ${t.scope}`.toLowerCase().includes(filter.toLowerCase()));return `<section class="panel"><div class="panel-heading"><h2>术语表与同义词</h2>${editable()?ontoButton('term-new','新增术语','',true):''}</div><div class="onto-filters"><input id="onto-term-search" placeholder="搜索标准术语、别名或范围" aria-label="搜索术语" value="${ontoEscape(filter)}"><span class="subtle">同一类型、语言及范围内检查别名冲突。</span></div>${ontoTable(['标准术语','别名','类型','语言','适用范围','操作'],rows.map(t=>[ontoEscape(t.standard),ontoEscape(t.aliases.join('、'))||'—',ontoEscape(draft.types.find(x=>x.id===t.typeId)?.name||t.typeId),ontoEscape(t.language),ontoEscape(t.scope),editable()?ontoButton('term-edit','编辑',`data-id="${t.id}"`)+ontoButton('term-delete','删除',`data-id="${t.id}"`):'只读']))}</section>`;}

  function actionsHtml(){return `<section class="panel"><div class="panel-heading"><h2>业务动作定义</h2>${editable()?ontoButton('action-new','新增动作','',true):''}</div><p class="ing-description">定义动作输入、写入对象和关联检查。历史指令使用明确标识的虚构样本核查。</p>${ontoTable(['动作类型','写入对象','输入字段','对象关联','操作'],draft.actions.map(a=>[ontoEscape(a.name),ontoEscape(draft.types.find(t=>t.id===a.typeId)?.name||a.typeId),ontoEscape(a.inputs.join('、')),ontoEscape(a.links.map(l=>`${l.field} → ${l.typeId}`).join('；')),ontoButton('action-preview','核查历史样本',`data-id="${a.id}"`)+(editable()?ontoButton('action-edit','编辑',`data-id="${a.id}"`)+ontoButton('action-delete','删除',`data-id="${a.id}"`):'')]))}</section>`;}
  function versionsHtml(){return `<section class="panel"><div class="panel-heading"><h2>本体版本与变更审批</h2><span class="subtle">草稿 → 送审 → 批准 → 发布</span></div><div class="onto-version-actions">${current()?.status==='draft'&&editable()?ontoButton('submit','送审','',true):''}${current()?.status==='submitted'&&model.capabilities['ontology-review']?ontoButton('approve','批准')+ontoButton('reject','退回修改'):''}${current()?.status==='approved'&&model.capabilities['ontology-publish']?ontoButton('publish-preview','查看影响并发布','',true):''}${ontoButton('compare','比较版本')}${ontoButton('impact','查看变更影响')}${current()?.status==='draft'&&model.capabilities['ontology-edit']?`<details class="onto-more-actions"><summary>更多操作</summary><div>${ontoButton('clone','复制为新草稿')}</div></details>`:''}</div>${ontoTable(['版本','状态','创建人','更新时间','操作'],[...model.versions].reverse().map(v=>[`<strong>${ontoEscape(v.name)}</strong><small class="block">v${v.number} · ${ontoEscape(v.id)}</small>`,`<span class="badge ${v.status==='published'?'teal':'blue'}">${ontoStatus[v.status]}</span>`,ontoEscape(v.createdByName),ontoTime(v.updatedAt),ontoButton('open-version',v.id===selectedId?'当前版本':'打开',`data-id="${v.id}"`)]))}<div class="onto-history"><h3>当前版本审批记录</h3>${(current()?.history||[]).map(h=>`<p><strong>${({submit:'送审',approve:'批准',reject:'退回',publish:'发布'})[h.action]}</strong> · ${ontoEscape(h.by)} · ${ontoTime(h.time)}${h.note?`<br>${ontoEscape(h.note)}`:''}</p>`).join('')||'<p class="subtle">尚无审批记录</p>'}</div></section>`;}
  function requireEdit(){if(!editable())throw new Error('此版本不可编辑，请复制为新草稿。');}

  function validationDialog(){const result=ontoValidate(draft);modal('Schema 校验',`<div class="notice ${result.valid?'':'demo-note'}">${result.valid?'校验通过，可进入送审流程。':`发现 ${result.errors.length} 项问题，请修改后再次校验。`}${dirty?' 当前检查包含未保存修改。':''}</div>${ontoTable(['位置','检查结果'],[...result.errors,...result.warnings].map(e=>[ontoEscape(e.path),ontoEscape(e.message)]))}`);}
  function typeFieldRow(f={key:'',name:'',datatype:'string',required:false,unit:''}){return `<div class="onto-field-row" data-onto-field>${ontoInput('字段标识','fieldKey',f.key,'required pattern="[a-zA-Z][a-zA-Z0-9_]{0,39}"')}${ontoInput('显示名称','fieldName',f.name,'required maxlength="80"')}<label class="form-field">数据类型<select name="fieldDatatype">${ontoDataTypes.map(v=>ontoOption(v,v,f.datatype)).join('')}</select></label>${ontoInput('单位','fieldUnit',f.unit,'maxlength="30"')}${ontoInput('最小值','fieldMin',f.min??'','type="number" step="any"')}${ontoInput('最大值','fieldMax',f.max??'','type="number" step="any"')}${ontoInput('枚举（逗号分隔）','fieldEnum',f.enum?.join(',')||'')}<label class="checkbox-label"><input name="fieldRequired" type="checkbox" ${f.required?'checked':''}>必填</label>${ontoButton('field-remove','移除字段')}</div>`;}

  function mappingDialog(id,typeId){requireEdit();const m=draft.mappings.find(m=>m.id===id);const type=draft.types.find(t=>t.id===(typeId||m?.typeId))||draft.types[0];if(!type)throw new Error('请先添加对象类型。');modal(m?'编辑字段映射':'新增字段映射',`<form id="onto-mapping-form" data-id="${m?.id||''}"><p class="ing-description">源字段对应数据接入模块治理后的标准字段，可输入自定义字段名。</p><datalist id="onto-source-fields">${(ingFieldSets[m?.sourceType||'stratum']||[]).map(([key,label])=>`<option value="${key}">${label}</option>`).join('')}</datalist>${ontoInput('映射名称','mappingName',m?.name||'','required maxlength="80"')}<div class="ing-form-pair"><label class="form-field">来源资料类型<select name="sourceType">${['stratum','log','trajectory','instruction','custom'].map(v=>ontoOption(v,v,m?.sourceType)).join('')}</select></label><label class="form-field">目标类型<select name="typeId" id="onto-mapping-type">${fieldOptions(type.id)}</select></label></div><div class="onto-map-fields">${type.fields.map(f=>{const row=m?.fields.find(r=>r.target===f.key);return `<div data-onto-map="${f.key}"><label class="form-field">源字段<input name="source" list="onto-source-fields" value="${ontoEscape(row?.source||'')}" placeholder="留空则不映射"></label><strong>→ ${ontoEscape(f.name)} ${f.required?'<span class="onto-required">必填</span>':''}<small class="block">${ontoEscape(f.key)} · ${f.datatype}</small></strong><label class="form-field">转换<select name="transform">${[['identity','保持原值'],['trim','去除首尾空格'],['number','转换为数值'],['datetime','时间检查']].map(([id,n])=>ontoOption(id,n,row?.transform||(['number','integer'].includes(f.datatype)?'number':'trim'))).join('')}</select></label></div>`;}).join('')}</div><div class="modal-actions"><button class="button primary">应用到草稿</button></div></form>`,{wide:true});}

  function mappingPreview(id){const m=draft.mappings.find(m=>m.id===id);if(!m)throw new Error('映射不存在。');const sample=sourceRows.length?sourceRows:[sampleStrata];mappingResult=ontoMapPreview(draft,m,sample);modal('字段映射样例预览',`<div class="notice">${ontoEscape(sourceRows.length?sourceLabel:'模板内置虚构分层样例；可加载当前项目的真实资料版本。')}</div><form id="onto-source-form" data-id="${id}"><div class="ing-form-pair"><label class="form-field">来源资料<select name="assetId" id="onto-source-asset" required><option value="">选择当前项目资料</option>${(context().assets||[]).filter(asset=>asset.managed&&(m.sourceType==='custom'||asset.objectType===m.sourceType)).map(asset=>ontoOption(asset.id,asset.name,sourceAssetId)).join('')}</select></label><label class="form-field">数据版本<select name="dataVersionId"><option value="">当前版本</option>${(sourceDetail?.versions||[]).map(v=>ontoOption(v.id,`v${v.number} · ${v.status}`,sourceVersionId)).join('')}</select></label></div><div class="onto-inline"><button class="button" type="submit">加载已治理资料</button>${ontoButton('mapping-sample','使用虚构样例',`data-id="${id}"`)}</div></form><h3 class="onto-section-title">源字段 → 本体属性</h3>${ontoTable(['源字段','目标属性','转换'],m.fields.map(f=>[ontoEscape(f.source),ontoEscape(`${m.typeId}.${f.target}`),ontoEscape(f.transform)]))}<h3 class="onto-section-title">样例检查（最多 20 条）</h3>${ontoTable(['行','源数据','映射结果','检查结果'],mappingResult.map((r,i)=>[r.row,`<pre class="onto-json">${ontoEscape(JSON.stringify(sample[i],null,2))}</pre>`,`<pre class="onto-json">${ontoEscape(JSON.stringify(r.output,null,2))}</pre>`,r.errors.length?`<span class="onto-error-text">${ontoEscape(r.errors.join('；'))}</span>`:'<span class="badge teal">通过</span>']))}`,{wide:true});}
  function actionDialog(id,typeId){requireEdit();const a=draft.actions.find(a=>a.id===id);const type=draft.types.find(t=>t.id===(typeId||a?.typeId))||draft.types.find(t=>t.id==='instruction')||draft.types[0];if(!type)throw new Error('请先添加对象类型。');modal(a?'编辑业务动作':'新增业务动作',`<form id="onto-action-form" data-id="${a?.id||''}">${ontoInput('动作名称','actionName',a?.name||'','required maxlength="80"')}${ontoInput('动作说明','description',a?.description||'','maxlength="300"')}<label class="form-field">写入对象类型<select name="typeId" id="onto-action-type">${fieldOptions(type.id)}</select></label><div class="onto-map-fields">${type.fields.map(f=>`<div data-onto-action-field="${f.key}"><label class="checkbox-label"><input name="included" type="checkbox" ${!a||a.inputs.includes(f.key)?'checked':''}>${ontoEscape(f.name)}${f.required?'（必填）':''}</label><label class="form-field">字段类型<input value="${f.datatype}" readonly></label><label class="form-field">关联对象类型<select name="linkType"><option value="">无需关联</option>${fieldOptions(a?.links.find(l=>l.field===f.key)?.typeId||'')}</select></label></div>`).join('')}</div><div class="modal-actions"><button class="button primary">应用到草稿</button></div></form>`,{wide:true});}

const kcEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kcTime=t=>t?new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—';
const kcStatus={queued:'排队中',running:'抽取中',failed:'失败',review:'待人工校核',published:'已发布',pending:'待校核',accepted:'已接受',rejected:'已驳回',done:'完成',created:'已创建任务',open:'待处理'};
const kcBadge=(s,tone)=>`<span class="badge ${tone||(s==='failed'||s==='rejected'?'red':s==='published'||s==='accepted'||s==='done'?'teal':'blue')}">${kcEsc(kcStatus[s]||s)}</span>`;
const kcBtn=(action,label,extra='',primary=false)=>`<button type="button" class="button ${primary?'primary':''}" data-kc="${action}" ${extra}>${label}</button>`;
const kcOpt=(value,label,current)=>`<option value="${kcEsc(value)}" ${value===current?'selected':''}>${kcEsc(label)}</option>`;
const kcTable=(headers,rows)=>`<div class="table-scroll"><table class="ing-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="ing-empty">暂无记录</td></tr>`}</tbody></table></div>`;
const kcJson=v=>kcEsc(JSON.stringify(v,null,2));
const kcSnippet=e=>{const raw=e.raw||'',span=e.span;return span?kcEsc(raw.slice(0,span.start))+`<mark>${kcEsc(raw.slice(span.start,span.end))}</mark>`+kcEsc(raw.slice(span.end)):kcEsc(raw);};

function createConstructionUI({getContext,repaint,modal,toast,go}){
  let model=null,task=null,project='',loading=false,error='',ticket=0,tab='tasks',selectedId='',candidateId='',busy=false,pollTimer;
  let filter={kind:'all',state:'all',confidence:'all'},candidatePage=1,structuredPage=1,sourceIndex=0,evaluationId='',evaluationPage=1,graphPage=1,graph=null,graphProject='',graphLoading=false,graphError='',graphTicket=0;
  const ctx=()=>getContext(),close=()=>document.querySelector('dialog')?.close();
  const selected=()=>task?.candidates.find(c=>c.id===candidateId);
  const pending=()=>task?.candidates.filter(c=>c.state==='pending').length||0;
  function schedule(){clearTimeout(pollTimer);if(model?.tasks.some(t=>['running','queued'].includes(t.status)))pollTimer=setTimeout(()=>{if(ctx().route==='construction'){if(document.querySelector('dialog[open]'))schedule();else load();}},900);}
  async function load(){
    const p=ctx().projectId;if(!p||!ctx().canConstruction)return;
    const id=++ticket;loading=true;
    try{
      const data=await api('/construction?'+new URLSearchParams({projectId:p}));if(id!==ticket||p!==ctx().projectId)return;
      if(project!==p){selectedId='';candidateId='';tab='tasks';filter={kind:'all',state:'all',confidence:'all'};evaluationId='';sourceIndex=0;}
      selectedId=data.tasks.some(t=>t.id===selectedId)?selectedId:data.tasks[0]?.id||'';
      const detail=selectedId?await api('/construction/task?'+new URLSearchParams({projectId:p,taskId:selectedId})):null;if(id!==ticket||p!==ctx().projectId)return;
      model=data;task=detail;project=p;error='';if(!filteredCandidates().some(c=>c.id===candidateId))candidateId=filteredCandidates()[0]?.id||'';
    }catch(cause){if(id===ticket){model=null;task=null;project=p;error=cause.message;}}
    finally{if(id===ticket){loading=false;repaint({preserveScroll:true});schedule();}}
  }
  function ready(){if(project!==ctx().projectId){if(!loading)load();return false;}return Boolean(model);}
  async function send(action,extra={}){
    if(busy)throw new Error('操作处理中，请稍候。');busy=true;const p=ctx().projectId;
    try{const result=await api('/construction/'+action,{projectId:p,taskId:task?.id,expectedRevision:task?.revision,...extra});if(p!==ctx().projectId)return null;close();if(action==='create')selectedId=result.id;await load();graph=null;graphProject='';return result;}finally{busy=false;}
  }

  function tasksHtml(){return `<section class="panel"><div class="panel-heading"><h2>抽取任务</h2><span class="subtle">选择任务查看固定输入与七阶段执行记录</span></div>${kcTable(['任务 / 来源','固定本体','候选 / 待校核','状态','创建人 / 时间','操作'],model.tasks.map(t=>[`<strong>${kcEsc(t.name)}</strong><small class="block">${kcEsc(t.id)} · ${t.sourceCount} 份资料 · ${t.origin==='event'?'事件触发':'手动创建'}</small>`,`v${t.ontologyNumber} · ${kcEsc(t.ontologyVersionId)}`,`${t.candidateCount} / ${t.pending}`,kcBadge(t.status),`${kcEsc(t.createdByName)}<small class="block">${kcTime(t.createdAt)}</small>`,kcBtn('select','查看任务',`data-id="${t.id}"`)]))}</section>${task?`<section class="panel kc-task-detail"><div class="panel-heading"><h2>${kcEsc(task.name)}</h2><div>${task.status==='failed'?kcBtn('retry','重试失败阶段'):''}${['review','published'].includes(task.status)?kcBtn('tab','进入人工校核','data-id="review"',true):''}</div></div>${task.error?`<div class="auth-message">${kcEsc(task.error)}</div>`:''}<ol class="kc-pipeline">${task.stages.map(s=>`<li class="${s.status}"><span>${kcBadge(s.status==='pending'?'等待执行':s.status)}</span><strong>${kcEsc(s.name)}</strong><small>${kcEsc(s.summary||s.error||'按依赖顺序执行')}</small><small>${s.attempt?`执行 ${s.attempt} 次 · ${kcTime(s.finishedAt)}`:'尚未执行'}</small></li>`).join('')}</ol>${kcTable(['固定资料 / 原件','数据版本 / 校验记录','记录数 / 格式','来源'],task.sources.map(s=>[kcEsc(s.fileName),`${kcEsc(s.versionId)}<small class="block">${kcEsc(s.qualityRunId)}</small>`,`${s.rows.length} / ${kcEsc(s.parsed.format.toUpperCase())}`,s.demo?'虚构演示资料':'用户资料']))}<p class="kc-note">解析与记录切分使用治理后的快照；置信度为规则分流分值，不是统计概率。候选入库后等待人工校核，不自动发布。</p></section>`:emptyInputs()}`;}
  function emptyInputs(){return `<section class="panel ing-empty"><h2>从合格资料开始构建</h2><p>当前可选择 ${model.sources.length} 份固定资料、${model.versions.length} 个已发布本体。</p><div class="kc-actions">${kcBtn('data','查看数据资料')}${kcBtn('ontology','管理本体')}${model.sources.length&&model.versions.length?kcBtn('new','创建第一个任务','',true):''}</div></section>`;}
  function filteredCandidates(){return (task?.candidates||[]).filter(c=>(filter.kind==='all'||c.kind===filter.kind)&&(filter.state==='all'||c.state===filter.state)&&(filter.confidence==='all'||(filter.confidence==='low'?c.confidence<task.config.confidence:c.confidence>=task.config.confidence)));}
  function reviewHtml(){

    const candidates=filteredCandidates(),pages=Math.max(1,Math.ceil(candidates.length/30));candidatePage=Math.min(candidatePage,pages);const c=selected(),canReview=model.capabilities.review&&task.status==='review';
    return `<div class="kc-review-toolbar"><span>${pending()} 项待校核 / 共 ${task.candidates.length} 项</span><div class="kc-actions">${model.capabilities.publish&&task.status==='review'?kcBtn('publish','审核完成并发布',pending()?'disabled title="请逐项处理全部候选"':'',true):''}${task.status==='published'?kcBtn('graph','查看已发布知识',`data-publication="${task.publicationId}"`):''}</div></div><div class="kc-workbench"><aside class="panel kc-candidates"><div class="kc-pane-head"><h2>候选知识</h2><span>${candidates.length} 项</span></div><div class="kc-filters"><label>类别<select id="kc-kind">${[['all','全部实体与关系'],['entity','实体'],['relation','关系']].map(([v,n])=>kcOpt(v,n,filter.kind)).join('')}</select></label><label>审核状态<select id="kc-state">${[['all','全部状态'],['pending','待校核'],['accepted','已接受'],['rejected','已驳回']].map(([v,n])=>kcOpt(v,n,filter.state)).join('')}</select></label><label>置信度<select id="kc-confidence">${[['all','全部置信度'],['low',`低于 ${task.config.confidence}`],['high',`不低于 ${task.config.confidence}`]].map(([v,n])=>kcOpt(v,n,filter.confidence)).join('')}</select></label></div><div class="kc-candidate-list">${candidates.slice((candidatePage-1)*30,candidatePage*30).map(item=>`<button data-kc="candidate" data-id="${item.id}" class="kc-candidate ${c?.id===item.id?'active':''}"><strong>${kcEsc(candidateName(item))}</strong><span>${kcEsc(item.typeName)} · ${item.kind==='entity'?'实体':'关系'} · ${Math.round(item.confidence*100)}%</span><span>${kcBadge(item.state)} ${item.errors.length?'<small>需修正</small>':''}</span><small>${kcEsc(item.evidence.fileName)} · ${item.evidence.format==='json'?'记录':'行'} ${item.evidence.line}</small></button>`).join('')||'<p class="ing-empty">当前筛选无候选</p>'}</div><div class="kc-pagination">${kcBtn('candidate-prev','上一页',candidatePage===1?'disabled':'')}<span>${candidatePage}/${pages}</span>${kcBtn('candidate-next','下一页',candidatePage===pages?'disabled':'')}</div></aside><section class="panel kc-evidence"><div class="kc-pane-head"><h2>原文与结构化证据</h2>${c?kcBadge(c.evidence.format.toUpperCase(),'neutral'):''}</div>${c?evidenceHtml(c.evidence):'<p class="ing-empty">选择左侧候选查看原文</p>'}</section><section class="panel kc-editor"><div class="kc-pane-head"><h2>编辑与审核</h2>${c?kcBadge(c.state):''}</div>${c?`<div class="kc-editor-body"><h3>${kcEsc(candidateName(c))}</h3><p class="subtle">${kcEsc(c.id)} · 候选版本 ${c.revision}</p>${c.errors.length?`<div class="auth-message">${c.errors.map(kcEsc).join('<br>')}</div>`:''}<form id="kc-review-form" data-candidate="${c.id}">${candidateFields(c,!canReview)}${canReview?`<label class="form-field">审核理由<textarea name="note" required maxlength="1000" placeholder="说明接受、驳回或修正依据"></textarea></label><div class="kc-review-actions"><button type="submit" name="decision" value="accept" class="button primary">接受</button><button type="submit" name="decision" value="modify" class="button">保存修改并接受</button><button type="submit" name="decision" value="reject" class="button">驳回</button></div>`:''}</form>${model.capabilities.review?kcBtn('issue','登记问题'):''}<h3>审核记录</h3>${c.history.slice().reverse().map(h=>`<details class="kc-history"><summary>${kcEsc(h.reviewer)} · ${kcEsc({accept:'接受',modify:'修改并接受',reject:'驳回'}[h.decision])} · v${h.revision}</summary><p>${kcEsc(h.note)}</p><small>${kcTime(h.time)} · ${kcEsc(h.ontologyVersionId)}</small><h4>修改前</h4><pre>${kcJson(h.before)}</pre><h4>修改后</h4><pre>${kcJson(h.after)}</pre></details>`).join('')||'<p class="subtle">尚无人工审核记录</p>'}${(task.issues||[]).filter(i=>i.candidateId===c.id).map(i=>`<p class="kc-issue">${kcEsc(i.id)} · ${kcEsc(i.note)} · 待处理</p>`).join('')}</div>`:'<p class="ing-empty">请选择候选</p>'}</section></div>`;
  }
  function candidateName(c){if(c.kind==='entity')return c.name;return `${task.candidates.find(e=>e.id===c.value.subjectId)?.name||'缺失主体'} — ${c.typeName} — ${task.candidates.find(e=>e.id===c.value.objectId)?.name||'缺失客体'}`;}
  function evidenceHtml(e){return `<div class="kc-evidence-body"><h3>${kcEsc(e.fileName)}</h3><p>${kcEsc(e.versionId)} · ${e.format==='json'?'记录序号':'原件行号'} ${e.line} · 列 ${kcEsc(e.column)}</p><pre class="kc-source-text">${kcSnippet(e)}</pre><dl class="ing-metadata">${[['井',e.well],['层位',e.layer],['单位',e.unit],['深度类型',e.depthType],['参考基准',e.datum]].map(([n,v])=>`<div><dt>${n}</dt><dd>${kcEsc(v||'未提供')}</dd></div>`).join('')}</dl><p class="kc-note">原件版本 ${kcEsc(e.originalVersionId||e.versionId)}；固定治理版本 ${kcEsc(e.versionId)}（${kcEsc(e.processingReason||'首次上传')}）。此处为原件记录，治理修正结果见候选属性与对照表。</p>${!offlineMode?`<a class="button" href="/api/ingestion/files/${encodeURIComponent(e.versionId)}">下载该版本原件</a>`:''}</div>`;}
  function candidateFields(c,disabled){

  function structuredHtml(){

  function evaluationHtml(){

  }
  function updatesHtml(){return `<section class="panel"><div class="panel-heading"><h2>资料事件触发配置</h2>${kcBtn('trigger','新增触发配置')}</div><p class="kc-note">仅当新资料或变更版本完成治理交接后触发抽取。配置前已有的交接不补建；每个触发器对同一固定资料版本只创建一个任务，所有结果仍须人工审核后发布。</p>${kcTable(['范围','固定本体','状态','操作'],model.triggers.map(t=>[kcEsc(t.objectType==='all'?'全部资料':t.objectType),kcEsc(t.ontologyVersionId),kcBadge(t.enabled?'已启用':'已停用'),kcBtn('toggle-trigger',t.enabled?'停用':'启用',`data-id="${t.id}"`)]))}</section><section class="panel"><div class="panel-heading"><h2>增量事件与更新任务</h2></div>${kcTable(['事件 / 输入版本','状态','更新任务','时间'],model.events.slice().reverse().map(e=>[`${kcEsc(e.id)}<small class="block">${kcEsc(e.versionId)}</small>`,`${kcBadge(e.status)} ${kcEsc(e.error||'')}`,e.taskId?kcBtn('select','查看更新任务',`data-id="${e.taskId}"`):kcBtn('event-retry','重试事件',`data-id="${e.id}"`),kcTime(e.createdAt)]))}</section><section class="panel"><div class="panel-heading"><h2>知识发布与刷新记录</h2></div>${kcTable(['发布 / 任务','实体 / 关系','图谱 / 索引 / 缓存','发布人 / 时间','操作'],model.publications.map(p=>[`${kcEsc(p.id)}<small class="block">${kcEsc(p.taskId)}</small>`,`${p.entityCount} / ${p.relationCount}`,Object.values(p.refresh).map(kcEsc).join('<br>')+`<small class="block">${kcEsc(p.external)}</small>`,`${kcEsc(p.publishedBy)}<small class="block">${kcTime(p.publishedAt)}</small>`,kcBtn('graph','查看图谱实体 / 关系',`data-publication="${p.id}"`)]))}</section>`;}
  function newDialog(){
    modal('新建知识抽取任务',!model.sources.length||!model.versions.length?`<p>需要已治理的固定资料和已发布本体才能创建任务。</p><div class="kc-actions">${kcBtn('data','前往数据接入')}${kcBtn('ontology','前往本体管理')}</div>`:`<form id="kc-create-form"><label class="form-field">任务名称<input name="name" required maxlength="100" value="地质资料知识抽取"></label><label class="form-field">固定本体版本<select name="ontologyVersionId" required>${model.versions.map(v=>kcOpt(v.id,`${v.name} · v${v.number}`,model.sources[0]?.binding?.versionId)).join('')}</select></label><fieldset class="kc-inputs"><legend>选择合格资料（最多10份、2000条记录）</legend>${model.sources.map(s=>`<label><input type="checkbox" name="handoffIds" value="${s.id}"><span>${kcEsc(s.name)}<small class="block">${kcEsc(s.versionId)} · ${s.recordCount}条 · ${kcEsc(s.qualityRunId)}</small></span></label>`).join('')}</fieldset><label class="form-field">低置信度分流阈值<input type="number" name="confidence" value="0.9" min="0" max="1" step="0.01" required></label><fieldset class="kc-inputs"><legend>流水线步骤（依赖顺序固定）</legend>${kcStages.map(([id,name])=>`<label><input type="checkbox" checked disabled><span>${kcEsc(name)}</span></label>`).join('')}</fieldset><label class="kc-check"><input type="checkbox" name="extractRelations" checked> 执行本体约束关系抽取</label><label class="kc-check"><input type="checkbox" name="normalizeTerms" checked> 使用本体术语与同义词归一</label><p class="kc-note">本版使用表格字段与术语规则抽取；七步按依赖顺序执行，候选入库后等待人工审核。任意自然语言、PDF / OCR 与机器学习模型需另行接入。</p><div class="modal-actions"><button type="submit" class="button primary">创建并运行</button></div></form>`,{wide:true});

  function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
  async function click(event){
    const b=event.target.closest('[data-kc]');if(!b)return false;const action=b.dataset.kc;
    try{
      if(action==='refresh')await load();
      if(action==='graph-refresh')await loadGraph();
      if(action==='tab'){tab=b.dataset.id;repaint({preserveScroll:true});}
      if(action==='new')newDialog();
      if(action==='data'||action==='ontology'){close();go(action);}
      if(action==='select'){selectedId=b.dataset.id;tab='tasks';candidateId='';sourceIndex=0;structuredPage=1;await load();}
      if(action==='candidate'||action==='locate'){candidateId=b.dataset.id;if(action==='locate')tab='review';repaint({preserveScroll:true});}
      if(action==='candidate-prev'||action==='candidate-next'){candidatePage+=action==='candidate-prev'?-1:1;repaint({preserveScroll:true});}
      if(action==='evaluation-prev'||action==='evaluation-next'){evaluationPage+=action==='evaluation-prev'?-1:1;repaint({preserveScroll:true});}
      if(action==='graph-prev'||action==='graph-next'){graphPage+=action==='graph-prev'?-1:1;repaint({preserveScroll:true});}
      if(action==='source-prev'||action==='source-next'){structuredPage+=action==='source-prev'?-1:1;repaint({preserveScroll:true});}
      if(action==='retry'){await send('retry');toast('已重试失败阶段。');}

function invalidateResult() {
  state.formDirty=true;state.activeResult=null;
  $('#judgement-result').innerHTML='<div class="notice">'+icon('info',16)+'输入已修改，请重新运行规则判定。历史结果保留在运行记录中。</div>';
  $('#measurement-origin').textContent='手工输入（演示）';$('.joint-panel button').disabled=true;
}

// SVG 原生鼠标聚焦会滚动整个图形；保留焦点但不移动当前视口。
document.addEventListener('mousedown',event=>{
  const node=event.target.closest('.graph-node,.onto-node,.onto-edge');
  if(!node||event.button!==0)return;
  event.preventDefault();
  node.focus({preventScroll:true});
});
document.addEventListener('click',async event=>{
  if(event.target.closest('[data-auth]')){await handleAuthAction(event);return;}
  if(await usersUI.click(event))return;
  if(!currentUser)return;
  const permissionButton=event.target.closest('[data-action]');
  const actionPermission={import:'import','run-rule':'run','export-run':'export','joint-analysis':'run'}[permissionButton?.dataset.action];
  if(actionPermission&&!permitted(actionPermission)){toast('无权执行此操作。');return;}
  try {
  if(await constructionUI.click(event))return;
  if(await ontologyUI.click(event))return;
  if(await ingestionUI.click(event))return;
  const routeButton=event.target.closest('[data-route]');
  if(routeButton){go(routeButton.dataset.route);return;}
  const control=event.target.closest('[data-action]');if(!control)return;
  const {action,well,type,run:runId}=control.dataset;
  if(action==='close-modal') {$('dialog')?.close();return;}
  if(action==='toggle-well'){state.expanded.has(well)?state.expanded.delete(well):state.expanded.add(well);$('#tree-list').innerHTML=treeHtml();return;}
  if(action==='expand-tree'){projectWells().forEach(w=>state.expanded.add(w.id));$('#tree-list').innerHTML=treeHtml();return;}
  if(action==='select-node'){
    state.selectedAssetId='';
    const changed=state.wellId!==well;
    state.wellId=well;state.selectedType=type;state.expanded.add(well);
    if(changed)state.activeResult=null;
    persist();
    if(changed)render();else updateObjectSelection();
    return;
  }
  if(action==='home-tab'){state.homeTab=control.dataset.tab;render();return;}
  if(action==='refresh'){state.updatedAt=new Date();await refreshWorkspace();toast('已重新读取当前身份与授权范围。');return;}
  if(action==='scenario'){go('retrieval',control.dataset.scenario);return;}
  if(action==='run-rule'){await runRule();return;}
  if(action==='evidence'){evidenceModal(control.dataset.evidence);return;}
  if(action==='run-detail'||action==='run-evidence'){
    const run=state.runs.find(r=>r.id===runId)||state.activeResult;if(!run)return;
    modal(action==='run-evidence'?'本次判定依据与输入快照':'规则判定记录',`<p>${escape(run.wellName)} / ${escape(run.referenceWellName)} · ${escape(run.time)}</p>${resultHtml(run)}<details class="snapshot"><summary>查看完整输入与版本快照</summary><pre>${escape(JSON.stringify(run,null,2))}</pre></details>`,{wide:true});return;
  }
  if(action==='export-run'){const existing=state.runs.find(r=>r.id===runId)||state.activeResult;if(existing){const run=await api('/business/export',{projectId:existing.projectId,wellId:existing.wellId,runId:existing.id});downloadJson(run,run.id+'.json');}return;}
  if(action==='joint-analysis'){
    if(!state.activeResult||state.formDirty){toast('请先完成有效的规则判定。');return;}
    modal('生成联合分析',`<div class="notice">${icon('info',18)}尚未配置大模型分析服务，本次没有生成联合分析结果。</div><p>当前已整理好可供分析使用的资料与证据包，可导出交由后续服务接入。</p><ul><li>场景：${state.scenario==='strata'?'地层对比':'邻井推荐'}</li><li>对象：${currentWell().short} / ${referenceWell().short}</li><li>规则：${escape(state.activeResult.result.rule.name)}（${escape(state.activeResult.result.rule.version)}）</li><li>判定：${escape(state.activeResult.result.title)}</li><li>内容：资料标识、实测输入、逐项判断、结论及来源快照</li></ul><button class="button primary" data-action="export-run" data-run="${state.activeResult.id}">${icon('download',15)}导出分析输入包</button>`);return;
  }
  if(action==='asset-detail'){
    await ingestionUI.open(control.dataset.asset);return;
  }
  if(action==='import'){
    await ingestionUI.import();return;
  }
  if(action==='notifications'){modal('我的待办',`<div class="task-list">${taskList()}</div><p class="subtle">当前展示示例校核任务。</p>`);return;}
  if(action==='profile'){modal('个人信息',`<div class="profile-card"><span class="avatar large">${escape(currentUser.name.slice(0,1))}</span><h3>${escape(currentUser.name)}</h3><p>${escape(currentUser.roleName)}</p></div><dl class="evidence-attributes"><div><dt>账号</dt><dd>${escape(currentUser.account)}</dd></div><div><dt>组织</dt><dd>${escape(currentUser.orgName)}</dd></div><div><dt>可访问项目</dt><dd>${projects.map(p=>escape(p.name)).join('、')||'尚未分配'}</dd></div></dl><div class="modal-actions"><button class="button danger" data-auth="logout">退出登录</button></div>`);return;}
  if(action==='help') modal('工作台使用说明','<ol><li>从左侧数据树选择井或知识对象，下方查看属性。</li><li>进入数据接入，上传CSV/JSON并确认字段、单位和深度基准。</li><li>查看质量问题，配置主数据映射或修正副本，再运行校验。</li><li>合格版本可提交至待知识构建清单，原件与历史版本保留。</li><li>混合检索与规则判定仍使用独立的虚构演示样例。</li></ol><p class="subtle">OCR、外部连接器、实时流及知识实体关系抽取尚未接入。</p>');
  }catch(error){toast(error.message);}
});
document.addEventListener('change',event=>{
  usersUI.change(event);
  ontologyUI.change(event);
  constructionUI.change(event);
  if(event.target.id==='project-select'&&ontologyUI.hasUnsaved()&&!window.confirm('当前本体有未保存修改，切换项目将放弃这些修改。是否继续？')){event.target.value=state.projectId;return;}
  if(event.target.id==='project-select'){state.selectedAssetId='';state.projectId=event.target.value;state.wellId=currentProject().wells[0];state.selectedType='well';state.expanded=new Set([state.wellId]);state.activeResult=null;state.treeFilter='';persist();render();}
  if(event.target.id==='analysis-well'){state.wellId=event.target.value;state.selectedType='well';state.expanded.add(state.wellId);state.activeResult=null;persist();render();}
  if(event.target.id==='sample-select'){state.sampleId=event.target.value;state.formDirty=false;state.activeResult=null;render();}
  if(event.target.id==='scenario-select'){state.scenario=event.target.value;state.activeResult=null;render();}
});
document.addEventListener('input',event=>{
  ontologyUI.input(event);
  if(event.target.id==='tree-search'){state.treeFilter=event.target.value;$('#tree-list').innerHTML=treeHtml();}
  if(['target-thickness','reference-thickness'].includes(event.target.id))invalidateResult();
});
document.addEventListener('submit',async event=>{
  if(event.target.id.startsWith('kc-')){event.preventDefault();await constructionUI.submit(event);return;}
  if(event.target.id.startsWith('onto-')||event.target.id.startsWith('ing-')||['login-form','admin-edit-form','audit-filter-form','rule-form'].includes(event.target.id))event.preventDefault();
  if(await ontologyUI.submit(event))return;
  if(event.target.id.startsWith('ing-')||['login-form','admin-edit-form','audit-filter-form','rule-form'].includes(event.target.id))event.preventDefault();
  if(await ingestionUI.submit(event))return;
  if(['login-form','admin-edit-form','audit-filter-form','rule-form'].includes(event.target.id))event.preventDefault();
  if(event.target.id==='login-form'){event.preventDefault();await login(event.target);return;}
  if(await usersUI.submit(event))return;
  if(!currentUser)return;
  try {
  if(event.target.id==='rule-form'){
    event.preventDefault();const threshold=Number($('#rule-threshold').value);if(!Number.isFinite(threshold)||threshold<=0){toast('请输入大于零的阈值。');return;}
    state.rule=await api('/business/rule-edit',{projectId:state.projectId,wellId:state.wellId,threshold,enabled:$('#rule-enabled').checked});state.activeResult=null;await refreshWorkspace();toast('规则已保存，历史记录保留原版本。');
  }
  }catch(error){toast(error.message);}
});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('.graph-node')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
const usersUI=createUsersUI({modal,toast,refresh:refreshWorkspace,getUser:()=>currentUser});
const ingestionUI=createIngestionUI({getContext:()=>({projectId:state.projectId,wellId:state.wellId,block:currentProject().block,canData:permitted('data'),canImport:permitted('import'),route:route()}),repaint:render,refresh:refreshWorkspace,modal,toast,go,constructionSelector:id=>ontologyUI.constructionSelector(id),selectAsset:asset=>{state.wellId=asset.wellId;state.selectedType=asset.objectType;state.selectedAssetId=asset.id;state.expanded.add(asset.wellId);}});
const ontologyUI=createOntologyUI({getContext:()=>({projectId:state.projectId,canOntology:permitted('ontology'),canConstruction:permitted('construction'),assets:getAssets()}),repaint:render,modal,toast,go});
const constructionUI=createConstructionUI({getContext:()=>({projectId:state.projectId,wellId:state.wellId,canConstruction:permitted('construction'),route:route()}),repaint:render,modal,toast,go});
document.addEventListener('dragstart',event=>ontologyUI.dragstart(event));
document.addEventListener('dragover',event=>{if(event.target.closest('.onto-canvas'))event.preventDefault();});
document.addEventListener('drop',event=>ontologyUI.drop(event));
document.addEventListener('pointerdown',event=>ontologyUI.pointerdown(event));
document.addEventListener('pointermove',event=>ontologyUI.pointermove(event));
document.addEventListener('pointerup',event=>ontologyUI.pointerup(event));
document.addEventListener('pointercancel',event=>ontologyUI.pointerup(event));
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('.onto-node,.onto-edge')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
window.addEventListener('beforeunload',event=>{if(ontologyUI.hasUnsaved()){event.preventDefault();event.returnValue='';}});
function applyPermissions(){
  for(const button of document.querySelectorAll('[data-route]'))if(!permitted(button.dataset.route))button.disabled=true;
  for(const button of document.querySelectorAll('[data-action]')){const key={import:'import','run-rule':'run','export-run':'export','joint-analysis':'run'}[button.dataset.action];if(key&&!permitted(key))button.hidden=true;}
  if(!permitted('rule-edit'))for(const input of document.querySelectorAll('#rule-form input,#rule-form button'))input.disabled=true;
  if(!projects.length||route()==='users'){document.querySelector('.context-bar')?.classList.add('hidden');document.querySelector('.data-sidebar')?.classList.add('hidden');document.querySelector('.app-body')?.classList.add('admin-layout');}
}
function clearSession(message=''){
  ingestionUI.clear();
  ontologyUI.clear();
  constructionUI.clear();
  state.selectedAssetId='';
  currentUser=null;projects=[];wells=[];initialTasks=[];authorizedAssets=[];allowedActions={};state.runs=[];state.imported=[];state.activeResult=null;state.projectId='';state.wellId='';state.homeTab='overview';state.treeFilter='';state.selectedType='well';state.expanded=new Set();usersUI.clear();clearTimeout(sessionTimer);$('#overlay-root').innerHTML='';loginNotice=message;authLoading=false;location.hash='/login';render();
}
async function refreshWorkspace(fetchData=true){
  if(fetchData){const me=await api('/auth/me');currentUser=me.user;const data=await api('/workspace');projects=data.projects;wells=data.wells;initialTasks=data.tasks;authorizedAssets=data.assets;allowedActions=data.capabilities||{};state.runs=data.runs;state.rule=data.rule;if(!projects.some(p=>p.id===state.projectId))state.projectId=projects[0]?.id||'';if(!projectWells().some(w=>w.id===state.wellId))state.wellId=projectWells()[0]?.id||'';state.expanded.add(state.wellId);state.activeResult=null;clearTimeout(sessionTimer);sessionTimer=setTimeout(()=>clearSession('登录已失效，请重新登录。'),Math.max(1,me.expires-Date.now()));}
  render();
}
async function login(form){
  const button=form.querySelector('[type="submit"]');button.disabled=true;button.textContent='正在登录…';
  try{const result=await api('/auth/login',{account:form.elements.account.value.trim(),password:form.elements.password.value});currentUser=result.user;loginNotice='';await refreshWorkspace();location.hash='/home';render();}
  catch(error){currentUser=null;const message=$('#login-message');if(message){message.textContent=error.message;message.classList.remove('hidden');}else clearSession(error.message);}
  finally{button.disabled=false;button.textContent='登录平台 →';}
}
async function handleAuthAction(event){const control=event.target.closest('[data-auth]');if(control.dataset.auth==='password'){const password=$('#login-password');password.type=password.type==='password'?'text':'password';control.textContent=password.type==='password'?'显示':'隐藏';control.setAttribute('aria-label',password.type==='password'?'显示密码':'隐藏密码');}
  if(control.dataset.auth==='account'){$('#login-account').value=control.dataset.account;$('#login-password').value='GeoDemo!2026';$('#login-account').focus();}
  if(control.dataset.auth==='logout'){try{await api('/auth/logout',{});clearSession('您已退出登录。');}catch(error){toast(error.message);}}
}
window.addEventListener('session-expired',()=>clearSession('登录已失效或账号已停用，请重新登录。'));
window.addEventListener('hashchange',async()=>{$('dialog')?.close();if(currentUser&&route()==='users')await usersUI.load();if(currentUser&&route()==='construction')await constructionUI.load();render();});
window.addEventListener('focus',async()=>{if(!currentUser)return;try{await refreshWorkspace();}catch(error){if(error.status!==401)toast(error.message);}});
async function start(){render();try{await refreshWorkspace();if(route()==='users')await usersUI.load();authLoading=false;render();}catch(error){if(error.status===401)clearSession();else {authLoading=false;clearSession('无法连接服务，请确认本机服务已启动后刷新。');}}}
start();

</script>
</body>
</html>
