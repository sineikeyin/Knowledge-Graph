<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="智能地质导向知识图谱平台：登录、用户组织、角色与项目授权、操作审计、资料及规则判定。">
  <title>智能地质导向知识图谱平台</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <style>
/* 参考老师示意图：顶部菜单与个人信息，左侧数据树及属性，右侧工作区。 */
.hidden,[hidden] {display:none!important;}
:root {
  --blue:#2563eb; --blue-hover:#1d4ed8; --blue-soft:#eef4ff;
  --ink:#263345; --muted:#7a8798; --border:#e5eaf1; --bg:#f4f6fa;
  --teal:#169b8c; --amber:#d18a20; --sidebar-width:258px;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  color:var(--ink); font-size:13px; font-synthesis:none;
}
* {box-sizing:border-box;}
body {margin:0;background:var(--bg);}
button,input,select {font:inherit;}
button {cursor:pointer;}
button,a,input,select,summary {outline-offset:3px;}
:focus-visible {outline:2px solid #6898f7;}
button {color:inherit;}
button:disabled {cursor:not-allowed;opacity:.48;}
button,a {-webkit-tap-highlight-color:transparent;}
a {color:var(--blue);text-decoration:none;}
a:hover {text-decoration:none;}
h1,h2,h3,p {margin:0;}
.icon {flex-shrink:0;vertical-align:middle;}
.skip-link {position:fixed;top:-100px;left:12px;background:white;z-index:20;padding:10px;}
.skip-link:focus {top:8px;}
#app {height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column;min-width:360px;}
.app-header {height:65px;flex-shrink:0;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:15px;}
.brand {display:flex;align-items:center;gap:11px;color:var(--ink);}
.brand-mark {width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--blue);color:white;box-shadow:0 3px 8px #2563eb20;}
.brand strong {display:block;font-size:17px;letter-spacing:.2px;font-weight:700;}
.brand small {display:block;color:#8a94a2;font-size:10px;margin-top:4px;letter-spacing:.8px;}
.header-right {display:flex;align-items:center;gap:15px;}
.demo-indicator {display:flex;align-items:center;gap:7px;color:#248775;font-size:11px;background:#eff9f5;border:1px solid #e3f3eb;padding:5px 9px;border-radius:20px;white-space:nowrap;}
.demo-indicator i,.status-dot {width:6px;height:6px;border-radius:50%;background:#32a985;display:inline-block;}
.update-time {font-size:10px;color:#939dab;white-space:nowrap;}
.header-divider {height:24px;width:1px;background:var(--border);}
.icon-button {width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:5px;color:#788496;}
.icon-button:hover {background:#f0f4fa;color:var(--blue);}
.icon-button.small {width:26px;height:26px;}
.user-button {display:flex;align-items:center;gap:9px;background:transparent;border:0;text-align:left;padding:5px;border-radius:6px;}
.user-button:hover {background:#f6f8fc;}
.avatar {display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#eaf1ff;color:var(--blue);font-size:14px;font-weight:700;}
.user-button strong {font-size:12px;font-weight:600;display:block;}
.user-button small {font-size:10px;color:#929cab;display:block;margin-top:3px;}
.user-button>.icon {margin-left:5px;}
.main-nav {display:flex;align-items:center;gap:5px;padding:0 20px;height:47px;flex-shrink:0;background:white;border-bottom:1px solid #dde5f1;overflow-x:auto;scrollbar-width:thin;}
.nav-item {display:flex;align-items:center;gap:7px;padding:8px 13px;border:0;background:transparent;color:#687689;font-size:12px;border-radius:6px;white-space:nowrap;}
.nav-item:hover {background:#f2f6fd;color:var(--blue);}
.nav-item.active {background:var(--blue);color:white;box-shadow:0 2px 5px #2563eb20;}
.context-bar {display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:11px 20px 13px;flex-shrink:0;background:#f6f8fc;border-bottom:1px solid var(--border);}
.context-controls {display:flex;align-items:center;gap:10px;min-width:0;}
.context-controls>label {font-size:10px;color:#8190a6;white-space:nowrap;}
select,input:not([type="checkbox"]):not([type="file"]) {height:33px;border:1px solid #dce3ed;border-radius:5px;background:white;padding:0 10px;color:#3d4a5d;min-width:0;}
select:hover,input:hover {border-color:#b5c6df;}
input[readonly] {background:#f7f9fc!important;color:#6c7a8b!important;}
.context-controls select {font-size:11px;height:30px;max-width:190px;}
.context-stat {font-size:10px;color:#8a96a8;border-left:1px solid #dfe5ee;padding-left:12px;white-space:nowrap;}
.context-stat b {font-size:13px;color:#485b75;margin-left:5px;font-weight:600;}
.context-stat.current-well b {color:var(--blue);}
.context-steps {display:grid;grid-template-columns:auto minmax(0,1fr) 14px minmax(0,1fr) 14px minmax(0,1fr);align-items:center;gap:20px;width:100%;max-width:880px;margin-inline:auto;color:#a5afbd;}
.context-steps>span {font-size:11px;color:#939eae;white-space:nowrap;}
.context-steps button {width:100%;font-size:11px;line-height:1.6;border:1px solid #e0e6ef;background:white;border-radius:5px;padding:7px 12px;color:#697a8f;white-space:nowrap;}
.context-steps button:hover {background:#f8fafc;border-color:#bdcddd;}

.app-body {display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);flex:1;min-height:0;}
/* 独立分配树与属性的高度；内容仅在各自区域内滚动。 */
.data-sidebar {display:grid;grid-template-rows:minmax(0,3fr) minmax(0,2fr);min-width:0;min-height:0;overflow:hidden;background:white;border-right:1px solid var(--border);}
.tree-pane {display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
.tree-pane>.pane-heading,.tree-search,.tree-import {flex-shrink:0;}
.pane-heading {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 16px 10px;}
.pane-heading h2 {font-size:12px;display:flex;align-items:center;gap:7px;font-weight:600;}
.pane-heading h2>.icon {color:#6b819c;}
.tree-search {margin:0 13px 11px;display:flex;align-items:center;border:1px solid #e5eaf1;border-radius:5px;padding-left:9px;gap:5px;color:#9aa7b8;}
.tree-search input {width:100%;border:0!important;background:transparent!important;height:30px!important;font-size:11px;padding-left:2px!important;}
.tree-search:focus-within {border-color:#92b4f7;}
.tree-search input:focus {outline:none;}
.tree-list {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 9px 10px;scrollbar-width:thin;}
.tree-project {padding:9px 8px;display:flex;align-items:center;gap:6px;color:#455875;background:#f7f9fc;border-radius:5px;margin-bottom:7px;}
.tree-project strong {font-size:11px;font-weight:600;}
.tree-project>.icon {color:#5d89cd;}
.tree-project small {margin-left:auto;font-size:10px;white-space:nowrap;color:#8e9aab;}
.tree-well-row {display:flex;align-items:center;border-radius:5px;height:34px;margin:2px 0;}
.tree-well-row.selected,.tree-leaf.selected {background:#eaf1ff;color:#2865ce;}
.tree-well-row:hover,.tree-leaf:hover {background:#f1f5fc;}
.tree-toggle {border:0;background:transparent;width:23px;height:30px;padding:4px;display:grid;place-items:center;color:#8b99ac;}
.tree-toggle.expanded>.icon {transform:rotate(90deg);}
.tree-node {border:0;background:transparent;display:flex;align-items:center;gap:7px;flex:1;text-align:left;padding:0 7px 0 0;min-width:0;height:100%;}
.tree-node>span {font-size:11px;font-weight:600;}
.tree-node>small {margin-left:auto;color:#9aa5b4;font-size:10px;}
.tree-node>.icon {color:#7591b9;}
.tree-children {padding:2px 0 5px 24px;}
.tree-leaf {border:0;background:transparent;display:flex;align-items:center;gap:7px;width:100%;padding:8px;font-size:11px;text-align:left;border-radius:4px;}
.tree-leaf .icon {color:#8ea2c0;}
.tree-leaf small {margin-left:auto;color:#a7b0be;font-size:10px;}
.tree-note {font-size:10px;color:#a3adba;margin:13px 8px;}
.tree-empty {padding:25px 10px;font-size:11px;color:var(--muted);text-align:center;}
.tree-import {background:#fff;border:1px dashed #d8e2f0;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:7px;color:#6684b4;font-size:11px;margin:5px 15px 14px;padding:8px;}
.tree-import:hover {background:#f5f8ff;border-color:#96b6ed;}
.properties-pane {min-width:0;min-height:0;border-top:1px solid var(--border);background:#fcfdff;padding-bottom:12px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;}
.property-name {display:flex;align-items:center;gap:8px;margin:5px 17px 12px;font-size:12px;}
.property-name>.icon {color:#6b94d1;}
.property-list {margin:0 17px;}
.property-list>div {display:grid;grid-template-columns:65px minmax(0,1fr);margin:9px 0;font-size:10px;line-height:1.55;gap:7px;}
dt {color:#8c99aa;}
dd {margin:0;overflow-wrap:anywhere;}
.property-link {margin:7px 17px 0;font-size:10px!important;}
.main-content {overflow-y:auto;overscroll-behavior:contain;min-width:0;padding:21px 23px 26px;scrollbar-width:thin;}
.page-heading {display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:19px;}
.breadcrumb {color:#99a4b4;font-size:10px;margin-bottom:7px;}
.breadcrumb>span {margin:0 7px;color:#c4ccd7;}
.page-heading h1 {font-size:22px;font-weight:650;line-height:1.5;letter-spacing:.4px;}
.page-heading p {margin-top:5px;color:#8b97a8;font-size:11px;line-height:1.7;}
.heading-actions {display:flex;align-items:center;gap:8px;flex-shrink:0;}
.button {display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #dce3ed;background:white;color:#61738c;border-radius:5px;padding:8px 12px;font-size:11px;font-weight:500;line-height:1.5;white-space:nowrap;}
.button:hover {border-color:#a3bce6;color:var(--blue);background:#f9fbff;}
.button.primary {background:var(--blue);border-color:var(--blue);color:white;}
.button.primary:hover {background:var(--blue-hover);}
.button:disabled:hover {background:white;}
.text-button {display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:#4f7fc9;font-size:10px;line-height:1.5;padding:0;}
.text-button:hover {color:#1d4ed8;}
.workspace-tabs {display:flex;align-items:center;gap:24px;border-bottom:1px solid #e0e6ef;margin-bottom:18px;}
.workspace-tabs>button:not(.refresh-button) {position:relative;border:0;background:transparent;padding:0 1px 12px;color:#8d98a8;font-size:11px;white-space:nowrap;}
.workspace-tabs>button.active {color:var(--blue);font-weight:600;}
.workspace-tabs>button.active::after {content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--blue);}
.refresh-button {display:flex;align-items:center;gap:5px;margin-left:auto;border:0;background:transparent;color:#8a98ac;font-size:10px;padding:0 0 12px;}
.metric-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px;}
.metric-card {display:flex;align-items:center;gap:13px;text-align:left;padding:17px 15px;background:white;border:1px solid var(--border);border-radius:7px;min-width:0;transition:border-color .15s,box-shadow .15s;}
.metric-card:hover {border-color:#b9cdec;box-shadow:0 3px 12px #24466b08;}
.metric-icon {height:41px;width:41px;display:grid;place-items:center;border-radius:10px;background:#eff5ff;color:#5688dd;flex-shrink:0;}
.metric-icon.indigo {background:#f1f0ff;color:#8b79ce;}
.metric-icon.amber {background:#fff7e9;color:#d6a14d;}
.metric-icon.teal {background:#eaf8f4;color:#51a995;}
.metric-copy {min-width:0;flex:1;}
.metric-copy>span {font-size:11px;color:#8090a5;display:block;}
.metric-copy>strong {display:block;font-size:25px;color:#314561;font-weight:650;line-height:1.5;}
.metric-copy>strong>small {font-size:10px;font-weight:400;color:#a1acbb;margin-left:7px;}
.metric-copy>small {display:block;color:#a2adbc;font-size:9px;white-space:nowrap;}
.metric-card>.icon {color:#b2bed0;}
.home-columns {display:grid;grid-template-columns:minmax(0,1.6fr) minmax(285px,1fr);gap:16px;margin-bottom:18px;}
.panel {background:white;border:1px solid var(--border);border-radius:7px;min-width:0;overflow:hidden;margin-bottom:18px;}
.home-columns>.panel {margin-bottom:0;}
.panel-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:14px 17px;}
.panel-heading h2 {display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.6;font-weight:600;}
.panel-heading h2>.icon {color:#718cab;}
.panel-heading>.text-button {flex-shrink:0;}
.panel-subtitle {font-size:10px;color:#8595aa;margin:0 17px 8px;}
.panel-subtitle>span {float:right;font-size:9px;color:#abb4c0;}
.graph-canvas {padding:0 9px;}
.knowledge-graph {display:block;width:100%;height:auto;min-height:210px;max-height:303px;}
.graph-edge {fill:none;stroke:#cfd9e8;stroke-width:1.4;}
.edge-label {fill:#9caabe;font-size:10px;paint-order:stroke;stroke:#fff;stroke-width:6px;}
.graph-node {cursor:pointer;outline:none;}
.graph-node:focus {outline:none;}
.graph-node:focus-visible rect {stroke:var(--blue);stroke-width:2.4;}
.graph-node rect {fill:#f6f9ff;stroke:#d5e2f6;transition:stroke .2s,fill .2s;}
.graph-node circle {fill:#7b9ed5;}
.graph-node.teal rect {fill:#f1faf7;stroke:#cde9df;}.graph-node.teal circle {fill:#6bad98;}
.graph-node.purple rect {fill:#f8f5ff;stroke:#e2d8f5;}.graph-node.purple circle {fill:#aa8bd5;}
.graph-node.amber rect {fill:#fffaf0;stroke:#f0e0bc;}.graph-node.amber circle {fill:#c9a45c;}
.graph-node.slate rect {fill:#f6f8fb;stroke:#d9e0ea;}.graph-node.slate circle {fill:#8a9bb2;}
.graph-node.selected rect,.graph-node:hover rect {stroke:var(--blue);stroke-width:1.8;}
.node-title {fill:#4b6488;font-size:12px;font-family:inherit;}
.node-subtitle {fill:#96a6bb;font-size:10px;font-family:inherit;}
.graph-legend {display:flex;align-items:center;justify-content:center;gap:13px;padding:12px;border-top:1px solid #f0f3f8;font-size:9px;color:#93a0b2;flex-wrap:wrap;}
.graph-legend>span {display:flex;align-items:center;gap:5px;}
.graph-legend>small {font-size:9px;margin-left:auto;}
.legend-dot {width:5px;height:5px;border-radius:50%;display:inline-block;}
.blue.legend-dot {background:#6d95d6;}.teal.legend-dot {background:#73b59f;}.purple.legend-dot {background:#a991d2;}.amber.legend-dot {background:#d2b477;}.slate.legend-dot {background:#8e9db1;}
.count-label {font-size:10px;color:#9ba7b8;}
.task-list {padding:0 16px;}
.task-row {border:0;border-bottom:1px solid #f0f3f7;background:white;width:100%;display:flex;align-items:center;gap:11px;padding:12px 0;text-align:left;}
.task-row:hover .task-copy strong {color:var(--blue);}
.task-row:last-child {border-bottom:0;}
.task-bullet {display:grid;place-items:center;flex-shrink:0;background:#eff4ff;color:#7c9cd1;width:31px;height:31px;border-radius:7px;}
.task-bullet.amber {background:#fcf6e9;color:#c4a465;}
.task-copy {flex:1;min-width:0;}
.task-copy strong {display:block;font-size:11px;font-weight:500;line-height:1.5;}
.task-copy small {display:block;font-size:9px;margin-top:5px;color:#a1acba;}
.badge {display:inline-flex;align-items:center;justify-content:center;font-size:9px;line-height:1.7;padding:2px 6px;background:#edf4ff;color:#5c87cd;border:1px solid transparent;border-radius:4px;white-space:nowrap;font-weight:400;}
.badge.teal {background:#ecf8f3;color:#519b82;}.badge.amber {background:#fff6e6;color:#c0954c;}.badge.neutral,.badge.slate {background:#f2f5f9;color:#8b9bb0;}.badge.red {background:#fff0ef;color:#ca6863;}
.task-bottom {font-size:9px;color:#a3afbf;margin:11px 17px 14px;display:flex;gap:6px;align-items:center;}
.recent-heading {border-top:1px solid #edf1f6;min-height:40px;padding-top:12px;padding-bottom:7px;}
.recent-heading h2 {font-size:11px;}
.compact-empty {text-align:center;color:#a6b1bf;font-size:10px;padding:15px 10px 21px;line-height:1.8;}
.compact-empty>.text-button {display:flex;justify-content:center;margin:8px auto 0;}
.recent-run {display:flex;align-items:center;text-align:left;width:100%;border:0;background:white;font-size:10px;padding:7px 17px;gap:8px;}
.recent-run>span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:#6c7d94;}
.recent-run>small {font-size:8px;color:#9aa8bb;}
.scenario-panel>.panel-heading {min-height:46px;padding-bottom:9px;}
.scenario-grid {display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 17px 16px;}
.scenario-card {display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #e7edf7;border-radius:6px;padding:15px;background:linear-gradient(110deg,#f6f9ff,#fcfdff);}
.scenario-card:hover {border-color:#b9cef1;}
.scenario-card>span:nth-child(2) {flex:1;min-width:0;}
.scenario-card strong {display:block;font-size:12px;font-weight:600;}
.scenario-card small {display:block;font-size:10px;color:#9ba7b9;margin-top:5px;}
.scenario-card>.icon {color:#91a7c8;}
.scenario-icon {color:#6892d4;display:grid;place-items:center;width:38px;height:38px;background:#ecf3ff;border-radius:9px;flex-shrink:0;}
.scenario-icon.teal {background:#e9f6f1;color:#6eaa95;}
.subtle {font-size:10px;color:#96a2b3;line-height:1.8;}
.table-scroll {overflow-x:auto;}
table {width:100%;border-collapse:collapse;font-size:11px;text-align:left;line-height:1.7;}
th,td {padding:12px 17px;border-bottom:1px solid #eef1f6;vertical-align:middle;}
th {font-size:10px;font-weight:500;color:#94a1b4;background:#fafbfd;white-space:nowrap;border-top:1px solid #edf1f6;}
td {color:#6c7b90;}
tr:last-child td {border-bottom:0;}
tbody tr:hover {background:#fcfdff;}
.file-name {display:flex;align-items:center;gap:8px;color:#5a7090;white-space:nowrap;}
.file-name>.icon {color:#93aacb;}
.align-right {text-align:right;}
.mono {font-family:Consolas,"SFMono-Regular",monospace;font-size:10px;}
.nowrap {white-space:nowrap;}
.status-bar {height:25px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;border-top:1px solid var(--border);padding:0 15px;font-size:9px;color:#9aa7b8;flex-shrink:0;}
.status-bar>span:first-child {display:flex;align-items:center;gap:7px;}
.footer-separator {margin:0 9px;color:#d1d8e2;}
.notice {display:flex;align-items:flex-start;gap:9px;font-size:11px;line-height:1.8;color:#7389a8;background:#f0f5ff;border:1px solid #dce8ff;padding:12px 14px;border-radius:6px;margin-bottom:16px;}
.notice>.icon {margin-top:2px;}
.demo-note {background:#f9fbff;color:#8394ad;border-color:#e1e8f4;}
.feature-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:3px 17px 20px;}
.feature-grid>div {border:1px solid #e7edf5;border-radius:6px;padding:15px;display:grid;grid-template-columns:30px 1fr;gap:5px;}
.feature-grid>div>span {grid-row:1/3;color:#9badd0;font:15px Consolas,monospace;}
.feature-grid strong {font-size:11px;font-weight:500;}
.feature-grid small {font-size:9px;color:#a1adbd;}
.graph-full .knowledge-graph {max-height:460px;}
.empty-state {padding:35px 20px;text-align:center;color:#a0aec0;}
.empty-state h3 {font-size:13px;font-weight:500;color:#7b8da6;margin-top:10px;}
.empty-state p {font-size:11px;margin:10px 0 18px;}
.analysis-context .panel-heading {border-bottom:1px solid #eef2f7;}
.section-index {font:10px/1.5 Consolas,monospace;display:grid;place-items:center;width:23px;height:23px;background:#eef4ff;color:#7698d1;border-radius:5px;margin-right:2px;}
.analysis-fields {display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:15px;padding:17px;}
.analysis-fields label,.measurement-row label {display:flex;flex-direction:column;gap:8px;font-size:10px;color:#8795a9;}
.analysis-fields label>input,.analysis-fields label>select {font-size:11px;width:100%;height:34px;}
.sample-controls {display:flex;align-items:center;gap:12px;background:#fbfcfe;border-top:1px solid #f0f3f8;padding:12px 17px;flex-wrap:wrap;}
.sample-controls label {font-size:10px;color:#8595ad;}
.sample-controls select {font-size:11px;min-width:260px;}
.sample-controls .subtle {margin-left:auto;font-size:9px;}
.analysis-grid {display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.source-card {margin:0 17px;padding:15px 0;border-top:1px solid #eef2f7;display:flex;gap:12px;}
.source-icon {color:#7a9fd4;background:#f0f5fc;border-radius:7px;width:34px;height:36px;display:grid;place-items:center;flex-shrink:0;}
.source-icon.teal {background:#eff8f5;color:#7bb29e;}
.source-card strong {display:block;font-size:11px;color:#526a8b;font-weight:600;}
.source-card small {display:block;font-size:9px;color:#a0adbd;margin-top:5px;}
.source-card p {font-size:10px;color:#8b9bb0;margin:8px 0;}
.evidence-footnote {background:#fafbfd;border-top:1px solid #eef2f7;padding:10px 17px;font-size:9px;line-height:1.8;color:#9aaac0;display:flex;gap:6px;}
.rule-detail {padding:0 17px 15px;}
.rule-name {display:flex;align-items:center;justify-content:space-between;gap:10px;}
.rule-name>strong {font-size:12px;font-weight:600;}
.rule-code {color:#a1adbf;margin-top:8px;font-size:9px;}
.rule-detail p {font-size:11px;color:#8696ac;line-height:1.9;margin-top:12px;padding-bottom:12px;border-bottom:1px solid #eef2f7;}
.rule-detail dl {margin:10px 0 0;font-size:10px;}
.rule-detail dl>div {display:grid;grid-template-columns:62px 1fr;gap:8px;line-height:1.9;margin:6px 0;}
.inline-warning {font-size:10px;color:#bc9959;background:#fff9eb;padding:9px;margin-top:10px;border-radius:4px;}
.rule-empty {padding:28px 22px;color:#8fa0b7;text-align:center;}
.rule-empty strong {display:block;margin:12px 0;font-size:13px;font-weight:500;}
.rule-empty p {font-size:11px;line-height:1.8;}
.measurement-row {display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:17px;border-top:1px solid #edf1f6;padding:17px;}
.measurement-row label {position:relative;}
.measurement-row label>span {position:absolute;right:9px;bottom:9px;color:#a1aec0;}
.measurement-row input {font-size:13px;height:35px;}
.measurement-basis {display:flex;flex-direction:column;gap:6px;font-size:10px;color:#96a5ba;justify-content:center;border-left:1px solid var(--border);padding-left:20px;}
.measurement-basis strong {font-weight:500;color:#7a8ca6;}
.measurement-basis small {font-size:9px;color:#a6b2c2;}
.judgement-empty {padding:25px 20px 32px;text-align:center;border-top:1px solid #f1f4f8;color:#a6b4c8;}
.judgement-empty strong {display:block;font-size:12px;font-weight:500;color:#879ab5;margin-top:8px;}
.judgement-empty p {font-size:10px;line-height:1.8;margin-top:8px;}
.result-summary {display:flex;align-items:center;gap:13px;margin:0 17px 16px;padding:15px;border-radius:6px;border:1px solid #e0e7ef;background:#f6f8fb;color:#8294ae;}
.result-summary.amber {background:#fffbf2;border-color:#f2e5c7;color:#ba9249;}
.result-summary.teal {background:#f0faf6;border-color:#d8ece3;color:#4b9478;}
.result-summary.red {background:#fff4f2;border-color:#f1ded8;color:#bd7467;}
.result-summary>div {flex:1;}
.result-summary strong {font-size:13px;font-weight:600;}
.result-summary p {font-size:10px;line-height:1.8;margin-top:6px;}
.result-summary>.badge {align-self:flex-start;}
.judgement-table td {font-size:10px;}
.judgement-table th {font-size:9px;}
.result-evidence {display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:10px;color:#8c9db4;padding:13px 17px;border-top:1px solid #eef2f7;}
.result-evidence>span {display:flex;align-items:center;gap:6px;line-height:1.8;}
.run-meta {display:flex;align-items:center;gap:12px;padding:10px 17px;background:#fafcfe;font-size:9px;color:#a4b0c0;flex-wrap:wrap;border-top:1px solid #f0f3f7;}
.run-meta>.text-button {margin-left:auto;font-size:9px;}
.joint-panel {display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px;}
.joint-panel h2 {display:flex;align-items:center;gap:8px;font-size:12px;}
.joint-panel p {color:#98a6b9;font-size:10px;line-height:1.8;margin-top:8px;}
.rule-library-body {display:grid;grid-template-columns:1fr 240px;gap:25px;border-top:1px solid #edf1f6;padding:20px;}
.rule-library-body h3 {font-size:15px;font-weight:600;}
.rule-library-body p {font-size:11px;line-height:1.9;color:#8a9bb2;margin-top:10px;}
.rule-attributes {font-size:11px;margin:16px 0 0;}
.rule-attributes>div {display:grid;grid-template-columns:75px 1fr;gap:10px;margin:10px 0;line-height:1.8;}
.rule-settings {border-left:1px solid #e6ecf4;padding-left:25px;display:flex;flex-direction:column;gap:12px;font-size:11px;color:#8294ac;}
.rule-settings>small {font-size:9px;line-height:1.8;color:#a3b0c3;}
.checkbox-label {display:flex;align-items:center;gap:7px;}
input[type="checkbox"] {accent-color:var(--blue);}
.typical-body {padding:0 18px 20px;}
.typical-body p {font-size:11px;color:#8295ae;line-height:1.8;margin:3px 0 14px;}
.typical-body>.subtle {display:block;margin-top:12px;}
.toast {position:fixed;left:50%;bottom:44px;transform:translate(-50%,15px);padding:12px 20px;border-radius:7px;background:#29405c;color:white;font-size:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;max-width:90vw;line-height:1.7;box-shadow:0 5px 20px #1a345028;}
.toast.show {opacity:1;transform:translate(-50%,0);}
.modal {width:min(540px,calc(100vw - 32px));max-height:85vh;border:1px solid #dce5f0;border-radius:10px;padding:0;color:var(--ink);box-shadow:0 16px 60px #0e234530;}
.modal.wide {width:min(900px,calc(100vw - 32px));}
.modal::backdrop {background:#172c4c44;backdrop-filter:blur(2px);}
.modal-head {display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:white;z-index:1;}
.modal-head h2 {font-size:15px;font-weight:600;}
.modal-body {padding:22px;font-size:12px;line-height:1.9;}
.modal-body h3 {font-size:15px;font-weight:600;}
.modal-body>p {margin:10px 0 15px;}
.modal-body ul,.modal-body ol {padding-left:21px;margin:12px 0 20px;}
.modal-body li {margin:9px 0;}
.modal-body .result-summary {margin:16px 0;}
.modal-body .run-meta {padding:10px 0;}
.modal-body .result-evidence {padding:10px 0;}
.source-dialog-title {display:flex;align-items:center;gap:15px;color:#6384b4;}
.source-dialog-title p {margin-top:6px;}
.evidence-attributes {margin:18px 0;font-size:12px;}
.evidence-attributes>div {display:grid;grid-template-columns:85px 1fr;gap:10px;border-bottom:1px solid #f0f3f8;padding:9px 0;}
.source-quote {padding:15px;border-left:3px solid #abc6ee;background:#f4f8ff;color:#6d88af;border-radius:0 5px 5px 0;font-size:12px;line-height:1.9;}
.modal-actions {display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
.form-field {display:flex;flex-direction:column;gap:7px;margin:16px 0;color:#7c8ea7;font-size:11px;}
.form-field input[type="file"] {font-size:11px;border:1px dashed #cedaec;border-radius:6px;padding:17px 12px;background:#f9fbff;width:100%;}
.snapshot {font-size:10px;color:#8ea0b9;margin-top:18px;}
.snapshot summary {cursor:pointer;}
.snapshot pre {font:10px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;background:#f5f8fc;border-radius:5px;color:#6d82a0;}
.profile-card {display:flex;flex-direction:column;align-items:center;gap:8px;}
.avatar.large {width:54px;height:54px;font-size:24px;margin-bottom:6px;}
.profile-card p {font-size:11px;color:#91a2b9;}
@media (min-width:1700px) {
  :root {--sidebar-width:280px;font-size:14px;}
  .main-content {padding:25px 30px;}
  .metric-card {padding:21px;}.metric-copy>strong {font-size:29px;}
  .home-columns {grid-template-columns:minmax(0,1.8fr) minmax(340px,1fr);}
  .knowledge-graph {max-height:350px;}
}
@media (max-width:1200px) {
  .context-steps {gap:14px;}.context-steps button {padding:7px 10px;}
  .header-right {gap:9px;}.update-time {display:none;}
  :root {--sidebar-width:230px;}
  .main-content {padding:18px;}.metric-grid {gap:9px;}.metric-card {gap:8px;padding:13px 10px;}
  .metric-icon {width:33px;height:35px;border-radius:7px;}.metric-copy>small {font-size:8px;}
  .metric-card>.icon {display:none;}.home-columns {grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);}
  .graph-legend>small {display:none;}.scenario-card {padding:12px;gap:9px;}
  .analysis-fields {grid-template-columns:1fr 1fr;}.sample-controls .subtle {display:none;}
}
@media (max-width:980px) {
  .context-steps {max-width:780px;}
  .header-right>.header-divider {display:none;}.app-header {padding:0 17px;}
  .brand strong {font-size:15px;}.brand small {font-size:9px;}
  .heading-actions {flex-wrap:wrap;justify-content:flex-end;}.page-heading {gap:12px;}
  .home-columns {grid-template-columns:1fr;}.tasks-panel {display:none;}
  .metric-grid {grid-template-columns:1fr 1fr;}.metric-copy>small {font-size:9px;}
  .scenario-grid {grid-template-columns:1fr;gap:9px;}.scenario-panel .panel-heading>.subtle {display:none;}
  .analysis-grid {grid-template-columns:1fr;gap:0;}.rule-library-body {grid-template-columns:1fr;}
  .rule-settings {border-left:0;border-top:1px solid var(--border);padding:18px 0 0;}
  .feature-grid {grid-template-columns:1fr 1fr;}
  .measurement-row {grid-template-columns:1fr 1fr;}.measurement-basis {grid-column:1/-1;border:0;padding:4px 0 0;}
  .result-summary>.badge {display:none;}.joint-panel {flex-wrap:wrap;}
}
@media (max-width:640px) {
  #app {height:auto;min-height:100dvh;}
  .app-header {height:auto;min-height:65px;padding:12px;gap:10px;flex-wrap:wrap;}
  .brand-mark {height:34px;width:34px;}.brand strong {font-size:14px;}.brand small {font-size:8px;}
  .header-right {margin-left:auto;gap:4px;}.header-right>.icon-button,.demo-indicator {display:none;}
  .user-button>span:not(.avatar),.user-button>.icon {display:none;}.avatar {height:30px;width:30px;}
  .main-nav {padding:7px 10px;height:47px;gap:3px;}.nav-item {font-size:11px;padding:8px 11px;}
  .context-bar {padding:9px 12px;gap:10px;}.context-controls {gap:7px;flex-wrap:wrap;}
  .context-steps {grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr) 10px minmax(0,1fr);gap:6px;}
  .context-steps>span {grid-column:1/-1;justify-self:center;}
  .context-steps button {font-size:10px;padding:6px 3px;}
  .context-controls select {max-width:145px;}.context-stat {padding-left:8px;font-size:9px;}.context-stat b {font-size:11px;margin-left:2px;}.context-stat.current-well {display:none;}
  .app-body {display:flex;flex-direction:column;}
  .data-sidebar {grid-template-columns:1.05fr 1fr;grid-template-rows:minmax(0,1fr);border-bottom:1px solid var(--border);height:280px;flex-shrink:0;}
  .tree-pane {border-right:1px solid var(--border);}.tree-list {min-height:0;}
  .tree-pane .pane-heading {padding:11px 10px 8px;}.pane-heading h2 {font-size:11px;}
  .tree-search {margin:0 8px 6px;}.tree-search input {font-size:9px;}.tree-project {padding:7px 3px;gap:4px;}.tree-project strong {font-size:9px;}.tree-project small {display:none;}
  .tree-well-row {height:30px;}.tree-node>span {font-size:10px;}.tree-children {padding-left:14px;}.tree-leaf {font-size:9px;padding:6px;}.tree-node>small {font-size:8px;}
  .tree-import {margin:5px 10px 9px;font-size:10px;padding:5px;}.tree-note {display:none;}
  .properties-pane {border-top:0;max-height:none;overflow:auto;padding-bottom:5px;}
  .properties-pane .pane-heading {padding:11px 10px 8px;}.properties-pane .badge {font-size:8px;}
  .property-name {margin:3px 10px 8px;font-size:10px;}.property-list {margin:0 10px;}.property-list>div {grid-template-columns:47px 1fr;font-size:8px;margin:7px 0;gap:4px;}.property-link {margin:5px 10px!important;font-size:9px!important;}
  .main-content {overflow:visible;padding:18px 12px;}.page-heading {flex-wrap:wrap;margin-bottom:17px;}.page-heading h1 {font-size:20px;}.page-heading p {font-size:10px;}.heading-actions {justify-content:flex-start;}
  .workspace-tabs {gap:19px;margin-bottom:14px;}.workspace-tabs>button:not(.refresh-button) {font-size:10px;}
  .metric-grid {gap:9px;margin-bottom:14px;}.metric-card {padding:12px 9px;gap:8px;}.metric-copy>strong {font-size:24px;}.metric-copy>span {font-size:10px;}.metric-copy>small {font-size:8px;}
  .panel {margin-bottom:14px;}.panel-heading {padding:13px;gap:8px;min-height:45px;}.panel-heading h2 {font-size:11px;}.panel-subtitle {margin:0 13px 8px;font-size:9px;}.panel-subtitle>span {display:none;}
  .knowledge-graph {min-height:190px;}.graph-legend {gap:9px;font-size:8px;padding:10px;}.graph-legend>small {display:none;}
  .scenario-grid {padding:0 13px 13px;}.scenario-card strong {font-size:11px;}.scenario-card small {font-size:9px;}
  .home-columns {margin-bottom:14px;}.tasks-panel {display:block;}.task-list {padding:0 13px;}
  th,td {padding:10px 13px;font-size:10px;}th {font-size:9px;}.file-name {font-size:10px;}
  .status-bar {font-size:8px;padding:7px 12px;height:auto;min-height:25px;}.status-bar>span:nth-child(2) {display:none;}
  .analysis-fields {gap:12px;padding:13px;}.analysis-fields label {font-size:9px;}.analysis-fields input,.analysis-fields select {font-size:10px!important;}
  .sample-controls {gap:9px;padding:13px;}.sample-controls label {font-size:9px;}.sample-controls select {min-width:0;width:calc(100% - 60px);font-size:10px;}.sample-controls .button {width:100%;}
  .measurement-row {gap:12px;padding:13px;}.measurement-row label {font-size:9px;}.measurement-basis {font-size:9px;}
  .result-summary {margin:0 13px 13px;padding:12px;gap:9px;}.result-summary strong {font-size:12px;}.result-summary p {font-size:9px;}.result-evidence {flex-wrap:wrap;font-size:9px;}
  .source-card {margin:0 13px;}.rule-detail {padding:0 13px 13px;}.joint-panel {padding:14px;}.joint-panel h2 {font-size:11px;flex-wrap:wrap;}.joint-panel>.button {width:100%;}
  .rule-library-body {padding:15px;gap:15px;}.feature-grid {grid-template-columns:1fr;padding:0 13px 15px;}
  .modal-body {padding:17px;}.modal-head {padding:14px 17px;}.modal-head h2 {font-size:13px;}
}
@media (prefers-reduced-motion:reduce) {* {scroll-behavior:auto!important;transition:none!important;}}
/* M1：身份与权限，沿用工作台蓝色及浅灰底色。 */
.admin-layout {grid-template-columns:minmax(0,1fr);}
.login-page {display:grid;grid-template-columns:1.05fr 1fr;min-height:100dvh;overflow:auto;background:white;}
.login-story {background:linear-gradient(145deg,#0e233f,#16447b 65%,#17657f);color:#fff;padding:40px 55px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.login-story::after {content:'';width:520px;height:520px;border:1px solid #ffffff12;border-radius:50%;position:absolute;right:-290px;top:80px;box-shadow:0 0 0 65px #ffffff03,0 0 0 130px #ffffff03;pointer-events:none;}
.login-brand {display:flex;align-items:center;gap:12px;color:#d8e8ff;font-size:11px;letter-spacing:2px;}
.login-brand .brand-mark {background:#ffffff17;border:1px solid #ffffff25;font-size:27px;}
.login-intro {margin:auto 0;padding:50px 0 20px;z-index:1;}
.login-eyebrow {font-size:12px;letter-spacing:3px;color:#93c2fa;}
.login-intro h1 {font-size:clamp(30px,3.2vw,50px);line-height:1.55;font-weight:600;letter-spacing:2px;margin:20px 0;}
.login-intro>p {font-size:13px;line-height:2.1;color:#b6cae0;}
.login-orbit {display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:14px;max-width:380px;margin:40px 0 12px;}
.login-orbit span,.login-orbit strong {padding:15px 12px;border:1px solid #8ebeff35;border-radius:9px;text-align:center;background:#ffffff08;color:#b7d2f1;font-size:12px;}
.login-orbit strong {grid-column:2;grid-row:1/3;padding:28px 8px;background:#598fe330;color:white;font-size:14px;box-shadow:0 0 40px #5899fa13;}
.login-story-foot {font-size:11px;color:#87a6c7;padding-top:20px;}
.login-side {display:grid;place-items:center;padding:45px 40px;background:radial-gradient(ellipse at 80% 0,#f4f8ff,white 65%);}
.login-card {width:100%;max-width:380px;}
.eyebrow {display:block;color:var(--blue);font-size:11px;letter-spacing:2px;line-height:1.8;}
.login-card h2 {font-size:28px;margin:9px 0 10px;letter-spacing:1px;}
.login-description {font-size:12px;color:var(--muted);margin-bottom:30px;}
.login-card .form-field {gap:9px;margin:19px 0;font-size:12px;color:#53647c;}
.login-card input {width:100%;height:45px!important;border-radius:7px!important;}
.password-control {display:flex;border:1px solid #dce3ed;border-radius:7px;background:white;}
.password-control input {border:0!important;flex:1;width:0;}
.password-control button {border:0;background:none;color:#8395b0;padding:0 13px;font-size:11px;}
.login-submit {width:100%;height:44px;justify-content:space-between!important;margin:10px 0 25px;padding:0 16px!important;}
.login-demo {background:#f7f9fd;border:1px solid #e7edf6;border-radius:8px;padding:15px;line-height:1.9;color:#8190a6;font-size:11px;}
.login-demo strong {color:#4d6481;font-size:11px;font-weight:600;}
.demo-account-buttons {display:flex;gap:5px;flex-wrap:wrap;margin:10px 0;}
.demo-account-buttons button {font-size:10px;padding:5px 7px;border:1px solid #d9e4f6;border-radius:4px;background:white;color:#4976b7;}
.login-foot {color:#a1adbc;font-size:10px;line-height:1.9;margin-top:21px;}
.auth-message {background:#fff1ef;border:1px solid #f0d4ce;border-radius:6px;color:#a84d40;padding:10px 12px;font-size:12px;line-height:1.8;margin:12px 0;}
.admin-tabs {display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow:auto;flex-shrink:0;}
.admin-tabs button {white-space:nowrap;padding:12px 5px;background:none;border:0;border-bottom:2px solid transparent;color:#7d8b9e;font-size:12px;}
.admin-tabs button.active {color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
.admin-summary {display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
.admin-summary>div {background:white;border:1px solid var(--border);border-radius:8px;padding:18px 22px;display:flex;align-items:center;gap:15px;}
.admin-summary strong {color:var(--blue);font-size:27px;font-weight:600;}
.admin-summary span {color:#8896a8;font-size:11px;}
.admin-split {display:grid;grid-template-columns:220px minmax(0,1fr);min-height:420px;}
.admin-side {border-right:1px solid var(--border);background:#fbfcfe;padding:8px 0;}
.admin-side-title {padding:15px 17px;color:#72829a;font-size:11px;font-weight:600;}
.org-tree-row {display:flex;align-items:center;gap:8px;min-height:38px;width:100%;border:0;background:none;color:#62748d;text-align:left;padding:9px 14px;font-size:11px;overflow-wrap:anywhere;}
.org-tree-row.active {background:#edf3ff;color:var(--blue);border-right:2px solid var(--blue);}
.org-tree-row:hover {background:#f0f5fd;}
.org-tree-row small {margin-left:auto;color:#9ca7b8;font-size:10px;}
.admin-content {min-width:0;}
.admin-toolbar {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;border-bottom:1px solid #eef1f6;}
.admin-toolbar h2 {font-size:14px;font-weight:600;}
.admin-toolbar small {display:block;color:#99a5b6;font-size:10px;margin-top:5px;}
.admin-tools {display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.admin-tools input {width:160px;}
.table-user {display:flex;align-items:center;gap:10px;}
.table-user .avatar {width:30px;height:30px;font-size:12px;}
.table-user strong {display:block;font-size:11px;font-weight:600;}
.table-user small,.block {display:block;color:#95a2b5;font-size:10px;margin-top:5px;}
.admin-pagination {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;font-size:11px;color:#8a97aa;}
.admin-pagination>div {display:flex;align-items:center;gap:12px;}
.admin-note {padding:13px 20px;background:#f8faff;color:#7e91ac;font-size:11px;line-height:1.9;border-bottom:1px solid #edf1f7;}
.org-detail {padding:25px;}
.org-detail h2 {font-size:20px;margin:8px 0 15px;}
.org-detail p {font-size:12px;color:#8594a9;}
.permission-preview {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:25px 0;}
.permission-preview span {padding:10px;background:#f7f9fc;border:1px solid #eef1f5;color:#a3aebc;border-radius:5px;font-size:11px;}
.permission-preview .granted {color:#3973c7;border-color:#dfebfd;background:#f1f6ff;}
.check-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;border:1px solid var(--border);border-radius:6px;padding:16px;margin:20px 0;color:#677990;font-size:12px;}
.check-grid legend {font-size:11px;padding:0 6px;color:#8b9ab0;}

// 确定性规则判定，与大模型分析分离。返回执行状态、业务结果、步骤和输入快照。
function evaluateThicknessRule(input, rule) {
  const measured = value => value === null || value === undefined || value === '' ? null : Number(value);
  const target = measured(input.targetThickness);
  const reference = measured(input.referenceThickness);
  const snapshot = { ...input, evidenceIds: [...(input.evidenceIds || [])], targetThickness: target, referenceThickness: reference };
  const result = (status, title, reason, steps = [], difference = null) => ({
    executionStatus: 'succeeded', status, title, reason, steps, difference,
    input: snapshot, rule: { ...rule }, evidenceIds: [...(input.evidenceIds || [])],
  });
  if (!rule.enabled || input.scenario !== rule.scenario || input.aligned !== true) {
    return result('no_rule', '无适用规则', !rule.enabled ? '该规则已停用。' : input.scenario !== rule.scenario ? '当前演示规则仅适用于地层对比场景。' : '尚未确认两井为同一对应层位，本规则不适用。');
  }
  if (input.conflict) return result('conflict', '规则冲突，待人工处理', '当前样例包含相互冲突的适用规则；解决冲突前不生成最终业务判断。');
  if (input.sameBasis !== true) return result('insufficient', '资料不足，暂时无法判断', '两井的单位或深度基准尚未统一，厚度差不可直接比较。');
  if (![target, reference].every(v => v !== null && Number.isFinite(v) && v > 0)) {
    return result('insufficient', '资料不足，暂时无法判断', '需要两井有效且大于零的厚度。缺失、非数值或无效厚度不按零值处理。');
  }
  const threshold = Number(rule.threshold);
  if (!Number.isFinite(threshold) || threshold <= 0) {
    return { ...result('error', '规则配置无效', '规则阈值必须为大于零的有效数值。'), executionStatus: 'failed' };
  }
  const difference = Number(Math.abs(target - reference).toFixed(6));
  const triggered = difference > threshold;
  const steps = [
    { name: '层位对应', actual: '已确认对应', condition: '两井属于同一对应层位', passed: true },
    { name: '单位与基准', actual: 'm / 同一深度基准', condition: '单位、深度基准一致', passed: true },
    { name: '厚度完整性', actual: `${target} m / ${reference} m`, condition: '两井厚度均有效且大于零', passed: true },
    { name: '厚度差判断', actual: `|${target} − ${reference}| = ${difference} m`, condition: `绝对差值 > ${threshold} m`, passed: triggered },
  ];
  return result(triggered ? 'triggered' : 'not_triggered', triggered ? '需要提示风险：厚度差待复核' : '未触发规则',
    triggered ? `厚度差 ${difference} m 超过演示阈值 ${threshold} m，建议人工复核层位及分层记录。` : `厚度差 ${difference} m 未超过演示阈值 ${threshold} m。`, steps, difference);
}

function activeUser(db,id) {const u=db.users.find(x=>x.id===id);if(!u?.enabled)fault('登录已失效或账号已停用，请重新登录。',401);return u;}
function isAdmin(db,user) {return db.roles.find(r=>r.id===user.roleId)?.permissions.includes('manage')===true;}
function permissionsFor(db,user,projectId) {
  if(isAdmin(db,user))return db.roles.find(r=>r.id===user.roleId).permissions;
  const member=db.members.find(m=>m.userId===user.id&&m.projectId===projectId);
  const role=db.roles.find(r=>r.id===(projectId?member?.roleId:user.roleId));
  return (role?.permissions||[]).filter(p=>!['manage'].includes(p));
}
function can(db,user,permission,projectId) {return permissionsFor(db,user,projectId).includes(permission);}
function requirePermission(db,user,p,projectId) {if(!can(db,user,p,projectId))fault('无权执行此操作。',403);}
function permittedWells(db,user,projectId) {
  const project=db.projects.find(p=>p.id===projectId);if(!project)return [];
  if(isAdmin(db,user))return project.wells;
  return db.members.find(m=>m.userId===user.id&&m.projectId===projectId)?.wellIds||[];
}
function resourceGrant(db,user,projectId,kind,id,wellId) {
  const grants=db.grants.filter(g=>g.userId===user.id&&g.projectId===projectId);
  return grants.find(g=>g.resourceType===kind&&g.resourceId===id)||grants.find(g=>g.resourceType==='well'&&g.resourceId===wellId)||grants.find(g=>g.resourceType==='project'&&g.resourceId===projectId);
}
function resourceAllowed(db,user,projectId,kind,id,wellId,action='view') {
  if(!permittedWells(db,user,projectId).includes(wellId))return false;
  if(isAdmin(db,user))return true;
  const grant=resourceGrant(db,user,projectId,kind,id,wellId);
  return !grant||grant.actions.includes(action);
}
function protectFields(db,user,projectId,kind,record,wellId) {
  const result=clone(record);const grant=isAdmin(db,user)?null:resourceGrant(db,user,projectId,kind,record.id,wellId);
  const hidden=new Set(grant?.hiddenFields||[]);
  // 同一井的关联视图也隐藏受限属性，避免从概览、原文摘要或历史快照绕过字段限制。
  if(!isAdmin(db,user))for(const g of db.grants.filter(g=>g.userId===user.id&&g.projectId===projectId&&((g.resourceType==='object'&&g.resourceId.startsWith(wellId+'-'))||(g.resourceType==='document'&&db.assets.some(a=>a.id===g.resourceId&&a.wellId===wellId)))))for(const field of g.hiddenFields)hidden.add(field);
  for(const field of hidden)delete result[field];

}

function createOfflineService() {

  return async(pathname,body)=>{
    if(pathname==='/auth/login') {const user=db.users.find(u=>u.account===body.account);if(!user||body.password!=='GeoDemo!2026')fault('账号或密码不正确。',401);if(!user.enabled)fault('账号已停用，请联系管理员。',403);session={userId:user.id,expires:Date.now()+30*60*1000};user.lastLogin=new Date().toISOString();auditEvent(db,user,'登录（离线演示）','会话');save();return {user:identity(db,user),expires:session.expires};}

    if(pathname==='/admin')return adminView(db,user);
    if(pathname.startsWith('/business/')){const result=business(db,user,pathname.split('/').pop(),body);save();return result;}

}

function treeHtml() {
  const filter=state.treeFilter.toLowerCase();
  let count=0;
  const rows=projectWells().map(well=>{
    const wellMatch=well.name.toLowerCase().includes(filter);
    const types=objectTypes.filter(t=>authorizedAssets.some(a=>a.wellId===well.id&&a.objectType===t.id)).filter(t=>wellMatch || t.name.includes(filter) || t.type.includes(filter));
    if(!wellMatch&&!types.length) return '';
    count++;
    const expanded=state.expanded.has(well.id)||Boolean(filter);
    return `<div class="well-group"><div class="tree-well-row ${well.id===state.wellId&&state.selectedType==='well'?'selected':''}"><button class="tree-toggle ${expanded?'expanded':''}" data-action="toggle-well" data-well="${well.id}" aria-label="${expanded?'折叠':'展开'}${well.name}" aria-expanded="${expanded}">${icon('chevron',13)}</button><button class="tree-node" data-action="select-node" data-well="${well.id}" data-type="well">${icon('well',16)}<span>${well.short}</span><small>${authorizedAssets.filter(a=>a.wellId===well.id).length} 份</small></button></div>${expanded?`<div class="tree-children">${types.map(type=>`<button class="tree-leaf ${state.wellId===well.id&&state.selectedType===type.id?'selected':''}" data-action="select-node" data-well="${well.id}" data-type="${type.id}">${icon(type.icon,14)}<span>${type.name}</span><small>${authorizedAssets.filter(a=>a.wellId===well.id&&a.objectType===type.id).length}</small></button>`).join('')}</div>`:''}</div>`;
  }).join('');
  return `<div class="tree-project">${icon('folder',16)}<strong>${currentProject().name}</strong><small>${projectWells().length} 井</small></div>${rows || '<div class="tree-empty">没有匹配的井或资料。</div>'}${count?'<div class="tree-note">选择对象可查看下方属性</div>':''}`;
}

function resultHtml(run) {
  const r=run.result;const tone=r.status==='triggered'||r.status==='conflict'?'amber':r.status==='not_triggered'?'teal':r.status==='error'?'red':'slate';
  return `<div class="result-summary ${tone}"><span class="result-icon">${icon(r.status==='not_triggered'?'check':r.status==='triggered'?'warning':'info',24)}</span><div><strong>${escape(r.title)}</strong><p>${escape(r.reason)}</p></div>${badge('演示判定',tone)}</div>${r.steps.length?`<div class="table-scroll"><table class="judgement-table"><thead><tr><th>判定项</th><th>实际值</th><th>规则条件</th><th>逐项结果</th></tr></thead><tbody>${r.steps.map(step=>`<tr><td>${step.name}</td><td>${escape(step.actual)}</td><td>${escape(step.condition)}</td><td>${badge(step.passed?'满足':'不满足',step.passed?'teal':'neutral')}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="result-evidence"><span>${icon('link',14)}证据：${escape(run.measurementSource)} · 输入快照已留存</span><button class="text-button" data-action="run-evidence" data-run="${escape(run.id)}">查看本次依据</button></div><div class="run-meta"><span class="mono">${escape(run.id)}</span><span>${escape(run.time)} · ${escape(r.rule.version)}</span><button class="text-button" data-action="export-run" data-run="${escape(run.id)}">${icon('download',13)}导出记录</button></div>`;
}

function historyHtml() {

  }

}
async function login(form){
  const button=form.querySelector('[type="submit"]');button.disabled=true;button.textContent='正在登录…';
  try{const result=await api('/auth/login',{account:form.elements.account.value.trim(),password:form.elements.password.value});currentUser=result.user;loginNotice='';await refreshWorkspace();location.hash='/home';render();}
  catch(error){currentUser=null;const message=$('#login-message');if(message){message.textContent=error.message;message.classList.remove('hidden');}else clearSession(error.message);}
  finally{button.disabled=false;button.textContent='登录平台 →';}
}
async function handleAuthAction(event){const control=event.target.closest('[data-auth]');if(control.dataset.auth==='password'){const password=$('#login-password');password.type=password.type==='password'?'text':'password';control.textContent=password.type==='password'?'显示':'隐藏';control.setAttribute('aria-label',password.type==='password'?'显示密码':'隐藏密码');}
  if(control.dataset.auth==='account'){$('#login-account').value=control.dataset.account;$('#login-password').value='GeoDemo!2026';$('#login-account').focus();}
  if(control.dataset.auth==='logout'){try{await api('/auth/logout',{});clearSession('您已退出登录。');}catch(error){toast(error.message);}}
}
window.addEventListener('session-expired',()=>clearSession('登录已失效或账号已停用，请重新登录。'));
window.addEventListener('hashchange',async()=>{$('dialog')?.close();if(currentUser&&route()==='users')await usersUI.load();render();});
window.addEventListener('focus',async()=>{if(!currentUser)return;try{await refreshWorkspace();}catch(error){if(error.status!==401)toast(error.message);}});
async function start(){render();try{await refreshWorkspace();if(route()==='users')await usersUI.load();authLoading=false;render();}catch(error){if(error.status===401)clearSession();else {authLoading=false;clearSession('无法连接服务，请确认本机服务已启动后刷新。');}}}
start();

</script>
</body>
</html>
